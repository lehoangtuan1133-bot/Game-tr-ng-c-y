  .garden-title { color: #fff; font-size: 16px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,.5); margin-bottom: 12px; position: relative; z-index: 1; }
  #garden { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; justify-content: center; max-width: 400px; margin: 0 auto; position: relative; z-index: 1; }
  .plot { aspect-ratio: 1; min-height: 96px; background: radial-gradient(circle at 30% 25%, #b98253 0%, transparent 55%), linear-gradient(160deg, #b07a45 0%, #8a5228 55%, #6b3f1e 100%); border: 4px solid #5a3417; border-radius: 18px; font-size: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; transition: transform .12s, box-shadow .25s, border-color .25s; padding: 0; color: #fff; box-shadow: inset 0 -8px 0 rgba(0,0,0,.28), inset 0 4px 0 rgba(255,255,255,.12), 0 6px 12px rgba(0,0,0,.5); touch-action: manipulation; }
  .plot::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,.18) 1px, transparent 1.5px), radial-gradient(rgba(255,255,255,.10) 1px, transparent 1.5px); background-size: 14px 14px, 20px 20px; background-position: 0 0, 7px 7px; pointer-events: none; opacity: .8; }
  .plot.drag-over { border-color: #ffe680; box-shadow: inset 0 -8px 0 rgba(0,0,0,.28), 0 0 0 6px rgba(255,230,128,.8), 0 0 24px rgba(255,230,128,.9); transform: scale(1.06); }
  .plot.ready { border-color: #ffd257; animation: bounce .8s infinite alternate; box-shadow: inset 0 -8px 0 rgba(0,0,0,.28), 0 0 22px rgba(255,210,87,.95), 0 0 0 3px rgba(255,230,128,.6); }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-7px); } }
  .progress-wrap { position: absolute; left: 8px; right: 8px; bottom: 7px; height: 12px; background: rgba(0,0,0,.5); border-radius: 8px; overflow: hidden; pointer-events: none; box-shadow: inset 0 2px 3px rgba(0,0,0,.6); }
  .progress { height: 100%; background: linear-gradient(90deg, #8ff05a, #3ea832, #2a8a24); border-radius: 8px; transition: width .9s linear; box-shadow: 0 0 8px rgba(120,240,90,.9); }
  .plot .crop-icon { font-size: 44px; line-height: 1; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); animation: sway 2.5s ease-in-out infinite; }
  @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .plot.ready .crop-icon { animation: popReady .6s ease-in-out infinite alternate; filter: drop-shadow(0 4px 8px rgba(255,210,87,.9)); }
  @keyframes popReady { from { transform: scale(1) rotate(-2deg); } to { transform: scale(1.15) rotate(2deg); } }
  .plot.watering::after { content: "💧"; position: absolute; top: 4px; right: 6px; font-size: 24px; animation: waterDrop .9s ease-out forwards; pointer-events: none; }

  .plot.fertilizing::after { content: "💩"; position: absolute; top: 4px; right: 6px; font-size: 24px; animation: waterDrop .9s ease-out forwards; pointer-events: none; }
  .toolbar { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; max-width: 480px; margin: 0 auto 16px; }

async function api(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Lỗi'); return j;
}
async function doRegister() {
  try {
    $('authErr').textContent = '';
    const j = await api('/api/register', { username: $('u').value, password: $('p').value });
    localStorage.setItem('token', j.token); connect();
  } catch (e) { $('authErr').textContent = e.message; }
}

    const j = await api('/api/login', { username: $('u').value, password: $('p').value });
    localStorage.setItem('token', j.token);
    if (j.isAdmin) { location.href = '/admin.html'; return; }
    connect();
  } catch (e) { $('authErr').textContent = e.message; }
}
function connect() {
  const token = localStorage.getItem('token'); if (!token) return;
  socket = io({ auth: { token } });
  socket.on('connect_error', () => { $('authErr').textContent = 'Lỗi đăng nhập!'; localStorage.removeItem('token'); });
  socket.on('state', st => { myData = st; $('authBox').style.display = 'none'; $('gameArea').style.display = ''; renderSeedGrid(); render(); });
  socket.on('toast', (msg, type) => toast(msg, type));
  socket.on('harvestResult', res => {
    const rect = document.querySelector(`.plot.ready`); 
    if (rect) { const r = rect.getBoundingClientRect(); floatCoin(res.reward, r.left + r.width / 2 - 20, r.top); }
    if (res.luckLabel !== 'x1') { SFX.luck(); toast(`✨ May mắn ${res.luckLabel}! +${res.reward} xu`, "success"); } 
    else { SFX.harvest(); toast(`+${res.reward} xu 🪙 +${res.xpGain} EXP`); }
    SFX.levelup();
  });
}
function toggleGUI(name, btn) {
  const panel = $("gui-" + name); const isOpen = panel.classList.contains("open");
  document.querySelectorAll(".gui-panel").forEach(p => p.classList.remove("open"));
  document.querySelectorAll(".tool-btn").forEach(b => b.classList.remove("active"));
  if (!isOpen) { panel.classList.add("open"); btn.classList.add("active"); setTimeout(() => panel.scrollIntoView({ behavior: "smooth", block: "nearest" }), 50); }
}
function switchTab(tier) { currentTab = tier; document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tier === tier)); renderSeedGrid(); }
function renderSeedGrid() {
  const grid = $("seedGrid"); grid.innerHTML = "";
  Object.entries(CROPS).forEach(([key, c]) => {
    if (c.tier !== currentTab) return;
    const card = document.createElement("div");
    card.className = "seed-card" + (selectedItem === key ? " selected" : "");
    card.innerHTML = `<span class="s-tier tier-${c.tier}">${TIER_INFO[c.tier].name}</span><span class="s-icon">${c.icon}</span><span class="s-name">${c.name}</span><span class="s-info">⏱ ${(c.time/1000).toFixed(0)}s · 💰 ${c.price} → ${c.sell} xu</span>`;
    card.onclick = () => { if (myData.coins < c.price) { SFX.error(); return toast("Không đủ xu!", "error"); } selectedItem = selectedItem === key ? null : key; renderSeedGrid(); };
    grid.appendChild(card);
  });
}
function render() {
  $("coins").textContent = myData.coins; $("water").textContent = myData.water; $("xp").textContent = myData.xp; $("level").textContent = myData.level; $("xpNext").textContent = myData.level * XP_PER_LEVEL;
  document.querySelectorAll(".item[data-type]").forEach(el => { el.classList.toggle("selected", selectedItem === el.dataset.type); });
  const garden = $("garden"); garden.innerHTML = "";
  myData.plots.forEach((plant, i) => {
    const b = document.createElement("div"); b.className = "plot"; b.dataset.index = i;
    if (plant) {
      const passed = Date.now() - plant.start + plant.bonus; const pct = Math.min(100, (passed / plant.time) * 100);
      if (plant.ready) { b.classList.add("ready"); b.innerHTML = `<span class="crop-icon">${CROPS[plant.key].icon}</span>`; } 
      else { b.innerHTML = `<span class="crop-icon">🌱</span><div class="progress-wrap"><div class="progress" style="width:${pct}%"></div></div>`; }
    } else { b.innerHTML = `<span class="crop-icon" style="opacity:.35;font-size:32px">🟫</span>`; }
    b.ondragover = e => { e.preventDefault(); b.classList.add("drag-over"); };
    b.ondragleave = () => b.classList.remove("drag-over");
    b.ondrop = e => { e.preventDefault(); b.classList.remove("drag-over"); const type = e.dataTransfer.getData("type"); if (type) useItem(i, type); };
    b.onclick = () => { if (selectedItem) useItem(i, selectedItem); else clickPlot(i); };
    garden.appendChild(b);
  });
  $("upgradeContent").innerHTML = myData.xp >= UPGRADE_XP ? `<h2>🏡 Shop nâng cấp</h2><button class="gold" onclick="socket.emit('buyPlot')">Mua thêm ô đất — 100 xu</button><p style="font-size:13px;opacity:.75">Số ô hiện tại: ${myData.plot_count}</p>` : `<span class="locked">🔒 Shop nâng cấp mở ở ${UPGRADE_XP} EXP (${myData.xp}/${UPGRADE_XP})</span>`;
}
document.querySelectorAll(".item[data-type]").forEach(el => {
  el.draggable = true;
  el.addEventListener("dragstart", e => { e.dataTransfer.setData("type", el.dataset.type); });
  el.addEventListener("click", () => { selectedItem = selectedItem === el.dataset.type ? null : el.dataset.type; render(); });
});
function useItem(i, type) {
  if (CROPS[type]) {
    if (myData.plots[i]) return toast("Ô đất đã có cây!", "error");
    if (myData.coins < CROPS[type].price) return toast("Không đủ xu!", "error");
    socket.emit('plant', { slot: i, crop: type }); selectedItem = null; SFX.plant();
  } else if (type === "water" || type === "fertilizer") {
    if (!myData.plots[i]) return toast("Chưa có cây!", "error");
    if (myData.plots[i].ready) return toast("Cây đã chín rồi!", "error");
    socket.emit('care', { slot: i, type });
    const plotEl = document.querySelector(`.plot[data-index="${i}"]`);
    if (plotEl) { plotEl.classList.add(type === 'water' ? 'watering' : 'fertilizing'); setTimeout(() => plotEl.classList.remove('watering', 'fertilizing'), 900); }
    selectedItem = null;
  }
}
function clickPlot(i) {
  const p = myData.plots[i];
  if (!p) return toast("Hãy chọn hạt giống và chạm vào ô đất!", "error");
  if (!p.ready) { const left = Math.ceil((p.time - (Date.now() - p.start + p.bonus)) / 1000); return toast(`Cây đang lớn! Còn ${left}s nữa ⏳`, "error"); }
  socket.emit('harvest', { slot: i });
}
function buyWater() { socket.emit('buyWater'); }
let audioCtx = null;
function initAudio() { if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); }
function playTone(freq, duration, type = "sine", vol = 0.15, slideTo = null) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + duration);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
const SFX = {
  plant: () => { playTone(400, 0.1, "sine", 0.12, 600); setTimeout(() => playTone(700, 0.12, "sine", 0.1), 80); },
  harvest: () => { playTone(523, 0.1, "sine", 0.15); setTimeout(() => playTone(659, 0.1, "sine", 0.15), 90); setTimeout(() => playTone(784, 0.18, "sine", 0.15), 180); },
  luck: () => { playTone(659, 0.1, "square", 0.12); setTimeout(() => playTone(880, 0.1, "square", 0.12), 80); setTimeout(() => playTone(1046, 0.2, "square", 0.12), 160); },
  levelup: () => { [392, 523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, 0.25, "triangle", 0.15), i * 90)); },
  error: () => { playTone(200, 0.15, "sawtooth", 0.12, 100); }
};
document.addEventListener("click", initAudio, { once: true });
function toast(text, type = "success") { const t = $("toast"); t.textContent = text; t.className = "show " + type; clearTimeout(t._tm); t._tm = setTimeout(() => (t.className = ""), 1800); }
function floatCoin(amount, x, y) { const el = document.createElement("div"); el.className = "float-coin"; el.textContent = "+" + amount + " 🪙"; el.style.left = x + "px"; el.style.top = y + "px"; document.body.appendChild(el); setTimeout(() => el.remove(), 1000); }
setInterval(() => { if (myData.plots.length) render(); }, 1000);
window.addEventListener('load', () => { if (localStorage.getItem('token')) connect(); });
</script>
</body>
