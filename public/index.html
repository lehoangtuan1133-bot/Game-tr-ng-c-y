<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌻 Nông Trại Tuấn Pro</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* ===== NỀN TRẮNG → ĐEN ===== */
  body {
    margin: 0;
    padding: 16px 16px 90px;
    text-align: center;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    color: #e8f5e9;
    user-select: none;
    background: linear-gradient(180deg, #ffffff 0%, #d8d8d8 20%, #8a8a8a 45%, #3a3a3a 70%, #0a0a0a 100%);
    background-attachment: fixed;
    position: relative;
    overflow-x: hidden;
  }

  body > * { position: relative; z-index: 1; }

  h1 {
    color: #ffffff;
    text-shadow: 2px 2px 0 #000, 4px 4px 0 rgba(0,0,0,.4), 0 0 24px rgba(255,255,255,.5);
    margin: 8px 0 16px;
    font-size: clamp(22px, 6vw, 34px);
    letter-spacing: 1px;
    animation: titleGlow 3s ease-in-out infinite alternate;
  }
  @keyframes titleGlow {
    from { text-shadow: 2px 2px 0 #000, 4px 4px 0 rgba(0,0,0,.4), 0 0 12px rgba(255,255,255,.3); }
    to   { text-shadow: 2px 2px 0 #000, 4px 4px 0 rgba(0,0,0,.4), 0 0 28px rgba(255,255,255,.8); }
  }

  h2 { margin: 8px 0; font-size: 18px; color: #176a36; }

  /* ===== THANH CHỈ SỐ ===== */
  .stats { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .stats div {
    background: rgba(255,255,255,.95); color: #1a1a1a; padding: 10px 16px; border-radius: 14px;
    font-weight: 700; font-size: 15px; box-shadow: 0 3px 0 rgba(0,0,0,.5), 0 0 12px rgba(255,255,255,.15);
    border: 1px solid rgba(0,0,0,.1);
  }

  /* ===== KHU VƯỜN ===== */
  .garden-wrap {
    max-width: 480px; margin: 0 auto 16px; padding: 18px 12px;
    background: linear-gradient(135deg, #7cc47f, #4ea65a 60%, #3d8f4a); border-radius: 24px;
    box-shadow: 0 10px 28px rgba(0,0,0,.6), 0 0 0 2px rgba(255,255,255,.3), inset 0 0 0 3px rgba(255,255,255,.25), inset 0 -8px 0 rgba(0,0,0,.15);
    position: relative;
  }
  .garden-wrap::before { content: ""; position: absolute; inset: 8px; border: 2px dashed rgba(255,255,255,.4); border-radius: 18px; pointer-events: none; }
  .garden-title { color: #fff; font-size: 16px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,.5); margin-bottom: 12px; position: relative; z-index: 1; }

  #garden { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; justify-content: center; max-width: 400px; margin: 0 auto; position: relative; z-index: 1; }

  .plot {
    aspect-ratio: 1; min-height: 96px;
    background: radial-gradient(circle at 30% 25%, #b98253 0%, transparent 55%), linear-gradient(160deg, #b07a45 0%, #8a5228 55%, #6b3f1e 100%);
    border: 4px solid #5a3417; border-radius: 18px; font-size: 40px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
    transition: transform .12s, box-shadow .25s, border-color .25s; padding: 0; color: #fff;
    box-shadow: inset 0 -8px 0 rgba(0,0,0,.28), inset 0 4px 0 rgba(255,255,255,.12), 0 6px 12px rgba(0,0,0,.5);
  }
  .plot::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(0,0,0,.18) 1px, transparent 1.5px), radial-gradient(rgba(255,255,255,.10) 1px, transparent 1.5px);
    background-size: 14px 14px, 20px 20px; background-position: 0 0, 7px 7px; pointer-events: none; opacity: .8;
  }
  .plot.ready { border-color: #ffd257; animation: bounce .8s infinite alternate; box-shadow: inset 0 -8px 0 rgba(0,0,0,.28), 0 0 22px rgba(255,210,87,.95), 0 0 0 3px rgba(255,230,128,.6); }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-7px); } }

  /* ===== MÀN HÌNH ĐĂNG NHẬP ===== */
  #authBox { 
    max-width: 340px; margin: 60px auto; background: rgba(255,255,255,0.95); color: #111; 
    padding: 24px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
  }
  #authBox input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; outline: none; }
  #authBox button { width: 100%; padding: 14px; background: #2e9e4f; color: #fff; border: 0; border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
  #authBox .btn-reg { background: #e2e8f0; color: #1a202c; }
  #authErr { color: #e53e3e; font-size: 14px; font-weight: bold; margin: 0; min-height: 20px; }
</style>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<!-- MÀN HÌNH ĐĂNG NHẬP -->
<div id="authBox">
  <h2 style="text-align:center; font-size: 24px; margin-bottom: 20px;">Đăng Nhập</h2>
  <input id="u" placeholder="Tên tài khoản">
  <input id="p" type="password" placeholder="Mật khẩu">
  <button onclick="doLogin()">Vào Game</button>
  <button class="btn-reg" onclick="doRegister()">Tạo Tài Khoản Mới</button>
  <p id="authErr"></p>
</div>

<!-- GIAO DIỆN GAME GỐC CỦA BẠN -->
<div id="gameArea" style="display:none">
  <h1>🌻 Nông Trại Tuấn Pro</h1>
  
  <div class="stats">
    <div>💰 Xu: <span id="coinValue">0</span></div>
  </div>

  <div class="garden-wrap">
    <div class="garden-title">KHU VƯỜN CỦA BẠN</div>
    <div id="garden"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let socket = null;
let myCoins = 0;
let myPlots = [];
let selectedCrop = 'carrot'; // Mặc định trồng cà rốt

// Cấu hình hiển thị cây (khớp với server)
const CROPS_CLIENT = { 
  carrot: { emoji: '🥕' }, 
  corn: { emoji: '🌽' }, 
  tomato: { emoji: '🍅' } 
};

async function api(url, body) {
  const r = await fetch(url, { 
    method: 'POST', 
    headers: { 'Content-Type': 'application/json' }, 
    body: JSON.stringify(body || {}) 
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Lỗi kết nối');
  return j;
}

async function doRegister() {
  try {
    $('authErr').textContent = '';
    const j = await api('/api/register', { username: $('u').value, password: $('p').value });
    localStorage.setItem('token', j.token); 
    connect();
  } catch (e) { $('authErr').textContent = e.message; }
}

async function doLogin() {
  try {
    $('authErr').textContent = '';
    const j = await api('/api/login', { username: $('u').value, password: $('p').value });
    localStorage.setItem('token', j.token);
    if (j.isAdmin) { location.href = '/admin.html'; return; }
    connect();
  } catch (e) { $('authErr').textContent = e.message; }
}

function connect() {
  const token = localStorage.getItem('token');
  if (!token) return;
  
  socket = io({ auth: { token } });
  
  socket.on('connect_error', err => { 
    $('authErr').textContent = 'Lỗi đăng nhập!'; 
    localStorage.removeItem('token'); 
  });
  
  socket.on('state', st => {
    myCoins = st.coins; 
    myPlots = st.plots;
    // Ẩn đăng nhập, hiện game
    $('authBox').style.display = 'none'; 
    $('gameArea').style.display = '';
    renderStats(); 
    renderGarden();
  });
  
  socket.on('toast', msg => alert(msg));
}

function renderStats() { 
  $('coinValue').textContent = myCoins; 
}

function renderGarden() {
  const g = $('garden'); 
  g.innerHTML = '';
  
  myPlots.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'plot';
    const cfg = p.crop ? CROPS_CLIENT[p.crop] : null;
    
    // Nếu có cây và đã chín
    if (cfg && Date.now() >= p.ready_at) {
      btn.classList.add('ready');
    }
    
    // Nếu ô trống
    if (!cfg) {
      btn.textContent = '🟫';
      btn.onclick = () => socket.emit('plant', { slot: p.slot, crop: selectedCrop });
    } 
    // Nếu có cây
    else {
      btn.innerHTML = `<span>${cfg.emoji}</span>`;
      btn.onclick = () => socket.emit('harvest', { slot: p.slot });
    }
    g.appendChild(btn);
  });
}

// Cập nhật lại giao diện mỗi giây để cây chín thì hiệu ứng nảy
setInterval(() => { 
  if (myPlots.length && $('gameArea').style.display !== 'none') {
    renderGarden(); 
  } 
}, 1000);

// Tự động đăng nhập lại nếu đã có token
window.addEventListener('load', () => { 
  if (localStorage.getItem('token')) connect(); 
});
</script>
</body>
 </html>
