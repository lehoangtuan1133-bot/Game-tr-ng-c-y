<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Nông Trại Tuấn Pro</title>
<style>
  body{font-family:'Segoe UI',Arial,sans-serif;background:#0f1419;color:#e8f5e9;margin:0;padding:20px}
  .cards{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
  .card{background:#1c2530;border:1px solid #2e3d4d;border-radius:14px;padding:16px 22px;min-width:140px}
  .card b{display:block;font-size:28px;color:#6ee7a0;margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:9px 10px;border-bottom:1px solid #26313d;text-align:left}
  th{color:#8fb3a0}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555}
  .dot.on{background:#22c55e;box-shadow:0 0 8px #22c55e}
  button{padding:5px 10px;border:0;border-radius:8px;cursor:pointer;font-weight:700}
  .ban{background:#dc2626;color:#fff}.unban{background:#16a34a;color:#fff}
</style>
</head>
<body>
<h1>🌻 Bảng điều khiển</h1>
<div class="cards" id="cards"></div>
<table>
  <thead><tr><th></th><th>ID</th><th>Tài khoản</th><th>Xu</th><th>Hành động</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script src="/socket.io/socket.io.js"></script>
<script>
const token = localStorage.getItem('token');
if (!token) location.href = '/';
const H = { 'Authorization': 'Bearer ' + token };

async function loadStats() {
  const r = await fetch('/api/admin/stats', { headers: H });
  if (r.status === 403) { alert('Bạn không phải admin'); location.href = '/'; return; }
  const s = await r.json();
  document.getElementById('cards').innerHTML = `
    <div class="card">Tổng tài khoản<b>${s.accounts}</b></div>
    <div class="card">Đang online<b>${s.online}</b></div>
    <div class="card">Mới hôm nay<b>${s.newToday}</b></div>
    <div class="card">Bị khoá<b>${s.banned}</b></div>
    <div class="card">Lượt trồng<b>${s.totalPlant}</b></div>
    <div class="card">Lượt thu hoạch<b>${s.totalHarvest}</b></div>
  `;
}

async function loadUsers() {
  const r = await fetch('/api/admin/users', { headers: H });
  const d = await r.json();
  document.getElementById('rows').innerHTML = d.rows.map(u => `
    <tr>
      <td><span class="dot ${u.online ? 'on' : ''}"></span></td>
      <td>${u.id}</td>
      <td>${u.username}${u.is_admin ? ' 👑' : ''}</td>
      <td>${u.coins}</td>
      <td>${u.is_admin ? '' : `<button class="${u.is_banned ? 'unban' : 'ban'}" onclick="setBan(${u.id}, ${u.is_banned ? 0 : 1})">${u.is_banned ? 'Mở khoá' : 'Khoá'}</button>`}</td>
    </tr>`).join('');
}

async function setBan(id, banned) {
  await fetch(`/api/admin/users/${id}/ban`, { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify({ banned: !!banned }) });
  loadUsers(); loadStats();
}

loadStats(); loadUsers();
setInterval(loadStats, 15000);
</script>
</body>
</html>
