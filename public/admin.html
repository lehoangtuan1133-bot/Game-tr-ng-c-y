<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Nông Trại Tuấn Pro</title>
<style>
  body{font-family:'Segoe UI',Arial,sans-serif;background:#0f1419;color:#e8f5e9;margin:0;padding:20px}
  h1{font-size:20px;margin-bottom:20px;text-align:center}
  .cards{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;justify-content:center}
  .card{background:#1c2530;border:1px solid #2e3d4d;border-radius:14px;padding:16px 22px;min-width:130px;text-align:center}
  .card b{display:block;font-size:26px;color:#6ee7a0;margin-top:6px}
  
  /* Cuộn ngang bảng trên điện thoại */
  .table-wrap{overflow-x:auto;background:#151d26;border-radius:12px;padding:10px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:400px}
  th,td{padding:10px 8px;border-bottom:1px solid #26313d;text-align:left}
  th{color:#8fb3a0;font-weight:normal}
  
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#555}
  .dot.on{background:#22c55e;box-shadow:0 0 8px #22c55e}
  button{padding:6px 10px;border:0;border-radius:8px;cursor:pointer;font-weight:700;font-size:12px}
  .ban{background:#dc2626;color:#fff}
  .unban{background:#16a34a;color:#fff}
  .edit{background:#3b82f6;color:#fff;margin-left:5px}
</style>
</head>
<body>

<h1>🌻 Bảng điều khiển Admin</h1>
<div class="cards" id="cards"></div>

<div class="table-wrap">
  <table>
    <thead>
      <tr><th>Online</th><th>ID</th><th>Tài khoản</th><th>Xu</th><th>Hành động</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const token = localStorage.getItem('token');
if (!token) location.href = '/';
const H = { 'Authorization': 'Bearer ' + token };

// Tải thông số thống kê
async function loadStats() {
  try {
    const r = await fetch('/api/admin/stats', { headers: H });
    if (r.status === 403) { alert('Bạn không phải admin!'); location.href = '/'; return; }
    const s = await r.json();
    document.getElementById('cards').innerHTML = `
      <div class="card">Tổng tài khoản<b>${s.accounts}</b></div>
      <div class="card">Đang online<b>${s.online}</b></div>
      <div class="card">Mới hôm nay<b>${s.newToday}</b></div>
      <div class="card">Bị khoá<b>${s.banned}</b></div>
      <div class="card">Lượt trồng<b>${s.totalPlant}</b></div>
      <div class="card">Lượt thu hoạch<b>${s.totalHarvest}</b></div>
    `;
  } catch(e) { console.log('Lỗi tải stats', e); }
}

// Tải danh sách người chơi
async function loadUsers() {
  try {
    const r = await fetch('/api/admin/users', { headers: H });
    const d = await r.json();
    document.getElementById('rows').innerHTML = d.rows.map(u => `
      <tr>
        <td><span class="dot ${u.online ? 'on' : ''}"></span></td>
        <td>${u.id}</td>
        <td>${u.username}${u.is_admin ? ' 👑' : ''}</td>
        <td>
          ${u.coins} 
          <button class="edit" onclick="editCoins(${u.id}, ${u.coins})">Sửa</button>
        </td>
        <td>
          ${u.is_admin ? 'Admin' : `
            <button class="${u.is_banned ? 'unban' : 'ban'}" onclick="setBan(${u.id}, ${u.is_banned ? 0 : 1})">
              ${u.is_banned ? 'Mở khoá' : 'Khoá'}
            </button>
          `}
        </td>
      </tr>
    `).join('');
  } catch(e) { console.log('Lỗi tải users', e); }
}

// Hàm sửa xu người chơi
async function editCoins(id, currentCoins) {
  const newCoins = prompt(`Nhập số xu mới cho tài khoản ID ${id}:`, currentCoins);
  if (newCoins !== null && !isNaN(newCoins)) {
    await fetch(`/api/admin/users/${id}/coins`, {
      method: 'POST', 
      headers: { ...H, 'Content-Type': 'application/json' },
      body: JSON.stringify({ coins: parseInt(newCoins) })
    });
    loadUsers(); // Tải lại bảng
  }
}

// Hàm khoá/mở khoá tài khoản
async function setBan(id, banned) {
  await fetch(`/api/admin/users/${id}/ban`, { 
    method: 'POST', 
    headers: { ...H, 'Content-Type': 'application/json' }, 
    body: JSON.stringify({ banned: !!banned }) 
  });
  loadUsers(); 
  loadStats();
}

// Khởi chạy
loadStats(); 
loadUsers();
setInterval(loadStats, 15000); // Tự động cập nhật mỗi 15s
</script>
</body>
</html>
