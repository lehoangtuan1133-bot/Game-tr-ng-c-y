<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Nông Trại Tuấn Pro</title>
<style>
  body{font-family:'Segoe UI',Arial,sans-serif;background:#050a12;color:#e2e8f0;margin:0;padding:20px 15px;background-image:radial-gradient(circle at 50% 0%, #102a43 0%, #050a12 70%);min-height:100vh;}
  h1{text-align:center;color:#00f3ff;text-shadow:0 0 10px #00f3ff,0 0 20px #00f3ff;font-size:24px;margin-bottom:25px;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:600px;margin:0 auto 20px;}
  .card{background:rgba(13,23,42,0.8);border-radius:12px;padding:15px;display:flex;align-items:center;gap:15px;border:1px solid #1e3a8a;box-shadow:0 0 15px rgba(30,58,138,0.5);}
  .card.green{border-color:#166534;box-shadow:0 0 15px rgba(22,101,52,0.5);}
  .card.red{border-color:#7f1d1d;box-shadow:0 0 15px rgba(127,29,29,0.5);}
  .card .icon{font-size:28px;}
  .card .info{display:flex;flex-direction:column;}
  .card .title{font-size:13px;color:#94a3b8;}
  .card .val{font-size:24px;font-weight:bold;color:#00f3ff;}
  .card.green .val{color:#22c55e;} .card.red .val{color:#ef4444;}
  .table-container{max-width:600px;margin:0 auto;background:rgba(13,23,42,0.9);border-radius:16px;border:1px solid #1e3a8a;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{color:#64748b;text-align:left;padding:12px 15px;border-bottom:1px solid #1e293b;}
  td{padding:12px 15px;border-bottom:1px solid #1e293b;}
  .status-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#475569;}
  .status-dot.on{background:#22c55e;box-shadow:0 0 8px #22c55e;}
  .lv-badge{background:rgba(139,92,246,0.2);color:#a78bfa;border:1px solid #7c3aed;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:bold;}
  .action-btn{background:none;border:none;color:#00f3ff;font-size:24px;cursor:pointer;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal.show{display:flex;}
  .modal-box{background:#0f172a;border:1px solid #00f3ff;border-radius:16px;width:100%;max-width:350px;padding:20px;color:#fff;position:relative;}
  .modal-box h3{color:#00f3ff;text-align:center;margin-top:0;}
  .input-group{margin-bottom:15px;}
  .input-group label{display:block;font-size:13px;color:#94a3b8;margin-bottom:5px;}
  .input-group input{width:100%;background:#020617;border:1px solid #1e3a8a;color:#fff;padding:12px;border-radius:8px;font-size:16px;outline:none;}
  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
  .btn-give{background:#22c55e;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;}
  .btn-ban{background:#ef4444;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;}
  .close-btn{position:absolute;top:15px;right:15px;background:none;border:none;color:#ef4444;font-size:20px;cursor:pointer;}
</style>
</head>
<body>
<h1>🌻 BẢNG ĐIỀU KHIỂN ADMIN</h1>
<div class="cards" id="cards"></div>
<div class="table-container">
  <table>
    <thead><tr><th>Online</th><th>Tài khoản</th><th>Cấp độ</th><th>Xu</th><th>Thao tác</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div class="modal" id="actionModal">
  <div class="modal-box">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h3 id="modalTitle">Tặng quà</h3>
    <div class="input-group"><label>🪙 Tặng Xu (Nhập âm để trừ)</label><input type="number" id="inputCoins" placeholder="0"></div>
    <div class="input-group"><label>💧 Tặng Nước</label><input type="number" id="inputWater" placeholder="0"></div>
    <div class="input-group"><label>✨ Tặng EXP</label><input type="number" id="inputXp" placeholder="0"></div>
    <div class="btn-row">
      <button class="btn-give" onclick="giveResources()">Xác nhận</button>
      <button class="btn-ban" id="btnBan" onclick="toggleBan()">Ban</button>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem('token');
if (!token) location.href = '/';
const H = { 'Authorization': 'Bearer ' + token };
let currentUserId = null, currentUserBanned = false;

async function loadStats() {
  const r = await fetch('/api/admin/stats', { headers: H });
  if (r.status === 403) { alert('Bạn không phải admin!'); location.href = '/'; return; }
  const s = await r.json();
  document.getElementById('cards').innerHTML = `
    <div class="card"><div class="icon">👥</div><div class="info"><span class="title">Tổng TK</span><span class="val">${s.accounts}</span></div></div>
    <div class="card green"><div class="icon">📡</div><div class="info"><span class="title">Online</span><span class="val">${s.online}</span></div></div>
    <div class="card red"><div class="icon">🔒</div><div class="info"><span class="title">Bị khoá</span><span class="val">${s.banned}</span></div></div>
  `;
}

async function loadUsers() {
  const r = await fetch('/api/admin/users', { headers: H });
  const d = await r.json();
  const sorted = d.rows.sort((a, b) => (b.online ? 1 : 0) - (a.online ? 1 : 0));
  document.getElementById('rows').innerHTML = sorted.map(u => `
    <tr>
      <td><span class="status-dot ${u.online ? 'on' : ''}"></span></td>
      <td style="font-weight:bold">${u.username}${u.is_admin ? ' 👑' : ''}</td>
      <td><span class="lv-badge">Lv.${u.level}</span></td>
      <td style="color:#eab308;font-weight:bold">💰 ${u.coins}</td>
      <td><button class="action-btn" onclick="openModal(${u.id}, '${u.username}', ${u.is_banned})">⋮</button></td>
    </tr>
  `).join('');
}

function openModal(id, username, isBanned) {
  currentUserId = id; currentUserBanned = !!isBanned;
  document.getElementById('modalTitle').textContent = `Thao tác: ${username}`;
  document.getElementById('inputCoins').value = '';
  document.getElementById('inputWater').value = '';
  document.getElementById('inputXp').value = '';
  const btn = document.getElementById('btnBan');
  btn.textContent = currentUserBanned ? 'Mở Khoá' : 'Ban';
  btn.style.background = currentUserBanned ? '#3b82f6' : '#ef4444';
  document.getElementById('actionModal').classList.add('show');
}
function closeModal() { document.getElementById('actionModal').classList.remove('show'); }

async function giveResources() {
  const coins = parseInt(document.getElementById('inputCoins').value) || 0;
  const water = parseInt(document.getElementById('inputWater').value) || 0;
  const xp = parseInt(document.getElementById('inputXp').value) || 0;
  if (coins === 0 && water === 0 && xp === 0) return alert('Nhập số lượng!');
  if (coins !== 0) await fetch(`/api/admin/users/${currentUserId}/give`, { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'coins', amount: coins }) });
  if (water !== 0) await fetch(`/api/admin/users/${currentUserId}/give`, { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'water', amount: water }) });
  if (xp !== 0) await fetch(`/api/admin/users/${currentUserId}/give`, { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'xp', amount: xp }) });
  alert('Đã gửi thành công!'); closeModal(); loadUsers();
}

async function toggleBan() {
  if (!confirm(currentUserBanned ? 'Mở khoá?' : 'BAN tài khoản?')) return;
  await fetch(`/api/admin/users/${currentUserId}/ban`, { method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify({ banned: currentUserBanned ? 0 : 1 }) });
  closeModal(); loadUsers(); loadStats();
}

loadStats(); loadUsers(); setInterval(loadStats, 10000);
</script>
</body>
</html>
