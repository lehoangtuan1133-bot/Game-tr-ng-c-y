<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Nông Trại Tuấn Pro</title>
<style>
  body{font-family:'Segoe UI',Arial,sans-serif;background:#0f1419;color:#e8f5e9;margin:0;padding:15px}
  h1{font-size:20px;margin-bottom:20px;text-align:center; color: #6ee7a0;}
  .cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;justify-content:center}
  .card{background:#1c2530;border:1px solid #2e3d4d;border-radius:14px;padding:12px 15px;min-width:100px;text-align:center;flex:1}
  .card span{font-size:12px; color:#8fb3a0}
  .card b{display:block;font-size:22px;color:#fff;margin-top:4px}
  
  .table-wrap{overflow-x:auto;background:#151d26;border-radius:12px;padding:10px}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
  th,td{padding:12px 8px;border-bottom:1px solid #26313d;text-align:center}
  th{color:#8fb3a0;font-weight:normal; background:#1c2530}
  
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#555}
  .dot.on{background:#22c55e;box-shadow:0 0 8px #22c55e}
  
  button{padding:6px 8px;border:0;border-radius:6px;cursor:pointer;font-weight:700;font-size:11px;margin:2px;}
  .ban{background:#dc2626;color:#fff}
  .unban{background:#16a34a;color:#fff}
  .add-coin{background:#eab308;color:#000;}
  .set-coin{background:#3b82f6;color:#fff;}
  
  .level-badge {background:#8b5cf6;color:#fff;padding:2px 6px;border-radius:4px;font-weight:bold;}
</style>
</head>
<body>

<h1>🌻 Bảng Điều Khiển Admin</h1>
<div class="cards" id="cards"></div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Trạng thái</th>
        <th>Tài khoản</th>
        <th>Cấp độ</th>
        <th>Đã thu hoạch</th>
        <th>Xu</th>
        <th>Hành động</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const token = localStorage.getItem('token');
if (!token) location.href = '/';
const H = { 'Authorization': 'Bearer ' + token };

async function loadStats() {
  try {
    const r = await fetch('/api/admin/stats', { headers: H });
    if (r.status === 403) { alert('Bạn không phải admin!'); location.href = '/'; return; }
    const s = await r.json();
    document.getElementById('cards').innerHTML = `
      <div class="card"><span>Tổng TK</span><b>${s.accounts}</b></div>
      <div class="card"><span>Online</span><b style="color:#22c55e">${s.online}</b></div>
      <div class="card"><span>Mới hôm nay</span><b>${s.newToday}</b></div>
      <div class="card"><span>Bị khoá</span><b style="color:#dc2626">${s.banned}</b></div>
    `;
  } catch(e) { console.log('Lỗi tải stats', e); }
}

async function loadUsers() {
  try {
    const r = await fetch('/api/admin/users', { headers: H });
    const d = await r.json();
    
    // Sắp xếp: Ai online lên đầu
    const sortedUsers = d.rows.sort((a, b) => (b.online ? 1 : 0) - (a.online ? 1 : 0));

    document.getElementById('rows').innerHTML = sortedUsers.map(u => `
      <tr style="${u.online ? 'background:rgba(34,197,94,0.05)' : ''}">
        <td><span class="dot ${u.online ? 'on' : ''}"></span></td>
        <td style="font-weight:bold">${u.username}${u.is_admin ? ' 👑' : ''}</td>
        <td><span class="level-badge">Lv.${u.level}</span></td>
        <td>🌾 ${u.total_harvested || 0} cây</td>
        <td style="color:#eab308; font-weight:bold">💰 ${u.coins}</td>
        <td>
          <button class="add-coin" onclick="addCoins(${u.id}, '${u.username}')">Tặng Xu</button>
          <button class="set-coin" onclick="setCoins(${u.id}, ${u.coins}, '${u.username}')">Sửa Xu</button>
          ${u.is_admin ? '' : `
            <button class="${u.is_banned ? 'unban' : 'ban'}" onclick="setBan(${u.id}, ${u.is_banned ? 0 : 1})">
              ${u.is_banned ? 'Mở Khoá' : 'Ban'}
            </button>
          `}
        </td>
      </tr>
    `).join('');
  } catch(e) { console.log('Lỗi tải users', e); }
}

// Hàm TẶNG xu (cộng thêm)
async function addCoins(id, username) {
  const amount = prompt(`Tặng thêm bao nhiêu xu cho "${username}"? (Nhập số âm để trừ tiền)`, "1000");
  if (amount !== null && !isNaN(amount)) {
    await fetch(`/api/admin/users/${id}/addcoins`, {
      method: 'POST', headers: { ...H, 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount: parseInt(amount) })
    });
    loadUsers();
  }
}

// Hàm SỬA xu (ghi đè)
async function setCoins(id, currentCoins, username) {
  const newCoins = prompt(`Sửa lại tổng số xu của "${username}":`, currentCoins);
  if (newCoins !== null && !isNaN(newCoins)) {
    await fetch(`/api/admin/users/${id}/setcoins`, {
      method: 'POST', headers: { ...H, 'Content-Type': 'application/json' },
      body: JSON.stringify({ coins: parseInt(newCoins) })
    });
    loadUsers();
  }
}

async function setBan(id, banned) {
  if(!confirm(banned ? 'Bạn có chắc muốn BAN tài khoản này?' : 'Mở khoá tài khoản này?')) return;
  await fetch(`/api/admin/users/${id}/ban`, { 
    method: 'POST', headers: { ...H, 'Content-Type': 'application/json' }, body: JSON.stringify({ banned: !!banned }) 
  });
  loadUsers(); loadStats();
}

loadStats(); loadUsers();
setInterval(loadStats, 15000); // Cập nhật số online mỗi 15s
</script>
</body>
</html>
